<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1113">
  <title>Llista de Tasques</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
</head>
<body>
  <div class="app">
    <header>
      <h1>📋 Llista de Tasques</h1>
      <p class="subtitle"><span id="pending-count">0</span> tasques pendents</p>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Afegeix una nova tasca..." autocomplete="off" required>
      <button type="submit">Afegir</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Totes</button>
      <button class="filter-btn" data-filter="pending">Pendents</button>
      <button class="filter-btn" data-filter="completed">Completades</button>
    </div>

    <ul id="task-list"></ul>

    <footer>
      <button id="clear-completed">Esborra completades</button>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
